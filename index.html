<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  
  <title>Frontend Mentor | IP Address Tracker</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <header class="header-container">
    <h1 class="title">IP Address Tracker</h1>
    
    <form class="search-form" id="search-form">
      <input 
        type="text" 
        class="search-input" 
        id="search-input" 
        placeholder="Search for any IP address or domain" 
        aria-label="IP Address Input"
      >
      <button type="submit" class="search-btn" aria-label="Submit Search">
        <svg xmlns="http://www.w3.org/2000/svg" width="11" height="14">
          <path fill="none" stroke="#FFF" stroke-width="3" d="M2 1l6 6-6 6"/>
        </svg>
      </button>
    </form>
    <p class="error-msg" id="error-msg" role="alert" hidden></p>

    <div class="info-card" aria-live="polite">
      <div class="info-group">
        <span class="info-label">IP Address</span>
        <span class="info-value" id="ip-address">192.212.174.101</span>
      </div>
      <div class="info-group">
        <span class="info-label">Location</span>
        <span class="info-value" id="location">Brooklyn, NY 10001</span>
      </div>
      <div class="info-group">
        <span class="info-label">Timezone</span>
        <span class="info-value" id="timezone">UTC -05:00</span>
      </div>
      <div class="info-group">
        <span class="info-label">ISP</span>
        <span class="info-value" id="isp">SpaceX Starlink</span>
      </div>
    </div>
  </header>

  <main id="map"></main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
